name: quantum-mobile-controller

services:
  quantum-mobile:
    image: marvelnccr/quantum-mobile:20.11.2a
    platform: linux/amd64
    container_name: quantum-mobile
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    volumes:
      - ./work:/home/max/work
    environment:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
